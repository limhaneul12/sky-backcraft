name: ${COMPOSE_PROJECT_NAME:-sky-backcraft}

services:
  app:
    build:
      context: .
      target: runtime
      args:
        SKY_BACKCRAFT_BUILD_REVISION: ${SKY_BACKCRAFT_BUILD_REVISION:-}
        SKY_BACKCRAFT_VERIFICATION_RECEIPT: ${SKY_BACKCRAFT_VERIFICATION_RECEIPT:-}
    image: ${SPOT_LAB_IMAGE:-sky-backcraft:local}
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 40s
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    ports:
      - "127.0.0.1:${SPOT_LAB_HOST_PORT:-8130}:8130"
    volumes:
      - spot-lab-data:/var/lib/spot-lab
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - spot-lab

  ci:
    build:
      context: .
      target: ci
      args:
        SKY_BACKCRAFT_BUILD_REVISION: ${SKY_BACKCRAFT_BUILD_REVISION:-}
        SKY_BACKCRAFT_VERIFICATION_RECEIPT: ${SKY_BACKCRAFT_VERIFICATION_RECEIPT:-}
    image: ${SPOT_LAB_CI_IMAGE:-sky-backcraft-ci:local}
    profiles:
      - ci
    network_mode: none
    environment:
      CARGO_NET_OFFLINE: "true"

  # Public exposure is operator-managed: route your own Cloudflare Named
  # Tunnel (or equivalent) to 127.0.0.1:${SPOT_LAB_HOST_PORT:-8130} and set
  # PUBLIC_DOMAIN. No tunnel containers run inside this compose project.

networks:
  spot-lab:
    driver: bridge

volumes:
  spot-lab-data:
